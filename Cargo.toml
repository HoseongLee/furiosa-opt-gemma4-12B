[package]
name = "furiosa-opt-gemma4"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.furiosa-opt]

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(backend, values("npu"))', 'cfg(furiosa_opt)'] }

[lib]
path = "src/lib.rs"

[dependencies]
furiosa-opt-std = "0.6.0"
tokio = { version = "1.29", features = ["rt", "rt-multi-thread", "sync", "macros"] }
safetensors = "0.4"
memmap2 = "0.9"
llm-tokenizer = "1.4.0"
num-traits = "0.2.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rand = "0.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
debug = false
strip = "symbols"
